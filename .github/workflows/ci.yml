name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, Prisma, build
    runs-on: ubuntu-latest
    env:
      # Placeholders de build uniquement (Prisma / Auth.js). Pas de secrets cloud.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-build-placeholder
      AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prisma validate
        run: npx prisma validate

      - name: Build
        run: npm run build
