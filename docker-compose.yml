services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: achille-postgis
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: achille
      POSTGRES_PASSWORD: achille
      POSTGRES_DB: achille
    volumes:
      - achille_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U achille -d achille"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  achille_pgdata:
